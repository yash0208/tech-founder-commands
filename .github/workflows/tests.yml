name: tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    # Python 3.9 builds are available for this image, unlike newer ubuntu-latest.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: [ "3.9", "3.12" ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (runner; git/gh mocked, offline)
        run: python3 tests/test_tfc_status.py
      - name: Installer + packaging tests
        run: python3 tests/test_install.py
